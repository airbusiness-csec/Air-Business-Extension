# Publishes a release when the version in manifest.json changes on main.
# Asset names stay the same each release so the .../releases/latest/download/
# links in the README and Intune scripts always get the newest one.
# The signing key is in the "release" environment, see intune/DEPLOYMENT.md.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Skip everything if this version's already been released.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Read version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$v already exists; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release for v$v yet; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # IntuneWinAppUtil only runs on Windows.
  intune:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # v1.8.7. If you upgrade it, change the commit and the hash together.
      - name: Download and verify Microsoft Win32 Content Prep Tool
        shell: pwsh
        run: |
          $url = 'https://raw.githubusercontent.com/microsoft/Microsoft-Win32-Content-Prep-Tool/1d6cfcbdf8c28edc596337031f74df951f38f718/IntuneWinAppUtil.exe'
          $expected = 'c1ba45b5cb939e84af064bb7ff4b38fb3dfe33c8dc1078fd9b157672eae671f6'
          $exe = Join-Path $env:RUNNER_TEMP 'IntuneWinAppUtil.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "IntuneWinAppUtil.exe hash mismatch: got $actual, expected $expected" }
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notlike 'CN=Microsoft Corporation,*') {
            throw "IntuneWinAppUtil.exe signature check failed: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          Write-Output "Verified IntuneWinAppUtil.exe ($actual), signed by $($sig.SignerCertificate.Subject)"

      - name: Build .intunewin
        shell: pwsh
        run: |
          if (Select-String -Path intune\*.ps1 -Pattern '__EXTENSION_ID__' -SimpleMatch -Quiet) {
            throw 'The extension ID has not been set in the intune scripts.'
          }
          $out = Join-Path $env:RUNNER_TEMP 'intune-out'
          & (Join-Path $env:RUNNER_TEMP 'IntuneWinAppUtil.exe') -c intune -s Install.ps1 -o $out -q
          if ($LASTEXITCODE) { throw "IntuneWinAppUtil.exe failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force intune-package | Out-Null
          Copy-Item (Join-Path $out 'Install.intunewin') intune-package\air-business-xslt-polyfill.intunewin
          Copy-Item intune\Detect.ps1 intune-package\air-business-xslt-polyfill-Detect.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intune-package
          path: intune-package/
          if-no-files-found: error
          retention-days: 1

  # Has the signing key, so it waits for approval on the release environment.
  release:
    needs: [check, intune]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intune-package
          path: intune-package

      - name: Build release zip
        run: python3 -I scripts/build_release.py

      - name: Sign CRX and write updates.xml
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "::error::The CRX_PRIVATE_KEY secret isn't set in the release environment."
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/crx-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$CRX_PRIVATE_KEY" > "$key"
          python3 -I scripts/pack_crx.py \
            --key "$key" \
            --zip "releases/air-business-xslt-polyfill-$VERSION.zip" \
            --crx air-business-xslt-polyfill.crx \
            --updates-xml updates.xml \
            --version "$VERSION" \
            --codebase "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/air-business-xslt-polyfill.crx"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cp "releases/air-business-xslt-polyfill-$VERSION.zip" air-business-xslt-polyfill.zip
          cp intune-package/air-business-xslt-polyfill.intunewin intune-package/air-business-xslt-polyfill-Detect.ps1 .
          sha256sum air-business-xslt-polyfill.zip air-business-xslt-polyfill.crx \
            air-business-xslt-polyfill.intunewin air-business-xslt-polyfill-Detect.ps1 > SHA256SUMS
          cat > notes.md <<'EOF'
          **Managed devices update automatically**; nothing to do.

          **Manual install:** download `air-business-xslt-polyfill.zip`. Installation steps are in `README.html` inside the zip.

          **Intune (IT only):** `air-business-xslt-polyfill.intunewin` is the Win32 app package and `air-business-xslt-polyfill-Detect.ps1` its detection script. Setup steps are in [intune/DEPLOYMENT.md](https://github.com/airbusiness-csec/Air-Business-Extension/blob/main/intune/DEPLOYMENT.md). You only need to re-upload them to Intune if this release changed the scripts in `intune/`; extension updates reach devices on their own.

          Verify downloads against `SHA256SUMS`.
          EOF
          gh release create "v$VERSION" \
            air-business-xslt-polyfill.zip \
            air-business-xslt-polyfill.crx \
            updates.xml \
            air-business-xslt-polyfill.intunewin \
            air-business-xslt-polyfill-Detect.ps1 \
            SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Air Business XSLT Polyfill $VERSION" \
            --notes-file notes.md
